<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Sort Visualizer</title>
<style>
  :root{
    --bg:#07080d; --panel:#0d1017; --line:#1b2030; --text:#eef1f8; --muted:#8b93a8;
    --accent:#ff7a45; --cyan:#35d0ff; --green:#3ddc97; --red:#ff4d5e;
    --dur:450ms;
    --f-front:#2a3855; --f-top:#3b4d72; --f-right:#1d2740;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(ellipse at 50% 0%,#1a1020 0%,var(--bg) 60%);color:var(--text);
       font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px}
  #fit{width:420px;transform-origin:top center}
  .card{width:420px;background:linear-gradient(#0a0c13,#07080d);border:1px solid var(--line);border-radius:18px;
        overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 50% 0,rgba(255,122,69,.10),transparent 55%),
      repeating-linear-gradient(60deg,transparent 0 38px,rgba(255,255,255,.025) 38px 39px),
      repeating-linear-gradient(-60deg,transparent 0 38px,rgba(255,255,255,.025) 38px 39px)}
  header{text-align:center;padding:26px 24px 0;position:relative;z-index:2}
  h1{font-size:25px;font-weight:800;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:8px auto 12px;max-width:300px}
  .pills{display:flex;gap:10px;justify-content:center}
  .pill{font:600 10px/1 ui-monospace,Menlo,monospace;padding:6px 10px;border-radius:99px;border:1px solid}
  .pill b{opacity:.6;font-weight:600;margin-right:6px;letter-spacing:1px}
  .pill.t{color:var(--cyan);border-color:rgba(53,208,255,.5);background:rgba(53,208,255,.07)}
  .pill.s{color:var(--green);border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.07)}

  /* ---------- stage ---------- */
  #stage{position:relative;height:340px;z-index:1}
  #mascot{position:absolute;left:0;top:0;width:60px;margin-left:-30px;z-index:5;
          transition:left var(--dur) cubic-bezier(.4,0,.2,1),top var(--dur) cubic-bezier(.4,0,.2,1)}
  #mascot::before{content:"";position:absolute;left:50%;bottom:calc(100% - 4px);width:2px;height:700px;margin-left:-1px;
          background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.85))}
  #mascot svg{display:block;transform-origin:30px 0;animation:sway 2.4s ease-in-out infinite;overflow:visible;
          filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  #mascot.dance svg{animation:spin 1s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes spin{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}

  #persp{position:absolute;left:0;right:0;top:130px;height:200px;perspective:1000px}
  #scene{position:absolute;left:0;top:0;width:420px;height:200px;transform-style:preserve-3d;
         transform:translateY(110px) scale(.9) rotateX(-26deg) rotateY(-12deg)}
  .wm{position:absolute;left:0;right:0;top:112px;text-align:center;font:700 13px ui-monospace,monospace;
      color:rgba(255,255,255,.07);letter-spacing:1px;z-index:0}

  /* generic 3D box: set --w --h --d on the element */
  .box{position:absolute;transform-style:preserve-3d;width:var(--w);height:var(--h)}
  .box>i{position:absolute;display:block;backface-visibility:hidden}
  .box .fr{width:var(--w);height:var(--h);left:0;top:0;background:var(--c-front,var(--f-front));
           transform:translateZ(calc(var(--d)/2));transition:background var(--dur)}
  .box .tp{width:var(--w);height:var(--d);left:0;top:calc((var(--h) - var(--d))/2);background:var(--c-top,var(--f-top));
           transform:rotateX(90deg) translateZ(calc(var(--h)/2));transition:background var(--dur)}
  .box .rt{width:var(--d);height:var(--h);left:calc((var(--w) - var(--d))/2);top:0;background:var(--c-right,var(--f-right));
           transform:rotateY(90deg) translateZ(calc(var(--w)/2));transition:background var(--dur)}
  .box .fr{display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
           font:700 15px ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}

  #platform{--w:392px;--h:16px;--d:64px;--f-front:#26324a;--f-top:#38486b;--f-right:#1a2336;
            left:14px;top:0}
  .bar{--w:34px;--d:34px;transition:transform var(--dur) cubic-bezier(.4,0,.2,1)}
  .bar .cube{position:absolute;inset:0;transform-style:preserve-3d}
  .bar.active{--c-front:#1f6f94;--c-top:#35d0ff;--c-right:#14506b}
  .bar.swap{--c-front:#b5522a;--c-top:#ff9a6b;--c-right:#7d3718}
  .bar.sorted{--c-front:#1f7a57;--c-top:#3ddc97;--c-right:#145a3f}
  .bar.hopA .cube{animation:hopA var(--dur) ease-in-out}
  .bar.hopB .cube{animation:hopB var(--dur) ease-in-out}
  @keyframes hopA{50%{transform:translate3d(0,-30px,40px)}}
  @keyframes hopB{50%{transform:translate3d(0,-12px,-40px)}}
  #bars,#slots{position:absolute;left:0;top:0;width:420px;height:0;transform-style:preserve-3d}
  .slot{position:absolute;width:1px;height:1px;top:0}

  /* ---------- narration ---------- */
  #narr{margin:0 20px;min-height:44px;display:flex;align-items:center;gap:10px;position:relative;z-index:2;
        background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
        font-size:13px;line-height:1.4}
  #narr .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex:none;box-shadow:0 0 10px var(--cyan)}
  #stats{display:flex;justify-content:space-between;margin:8px 22px 0;font:600 10px ui-monospace,monospace;
         color:var(--muted);letter-spacing:.5px;position:relative;z-index:2}
  #stats b{color:var(--text)}

  /* ---------- code ---------- */
  #code{margin:14px 20px 20px;background:rgba(10,12,18,.85);border:1px solid var(--line);border-radius:10px;
        padding:12px 0;font:11.5px/1.75 ui-monospace,"SF Mono",Menlo,Consolas,monospace;position:relative;z-index:2}
  .ln{display:block;white-space:pre;padding:0 14px 0 8px;border-left:2px solid transparent;color:#cdd6f4;transition:background .2s}
  .ln i{display:inline-block;width:22px;color:#555d75;font-style:normal;user-select:none}
  .ln.hl{background:rgba(255,77,94,.16);border-left-color:var(--red)}
  .k{color:#cba6f7}.f{color:#89b4fa}.n{color:#fab387}.b{color:#35d0ff}

  /* ---------- controls ---------- */
  #ctrl{width:420px;display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
  button,select,input{font:600 13px system-ui,sans-serif;background:#141926;color:var(--text);border:1px solid #262d42;
         border-radius:9px;padding:9px 13px;cursor:pointer}
  button:hover,select:hover{border-color:#3a4566}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1a0b04;min-width:84px}
  input{cursor:text;width:170px;font-weight:500}
  #seek{width:420px;margin-top:12px;accent-color:var(--accent)}
  .hint{color:var(--muted);font-size:11px;margin-top:10px}
</style>
</head>
<body>

<div id="fit">
  <div class="card">
    <header>
      <h1>BUBBLE SORT</h1>
      <p class="sub">Repeatedly swaps adjacent out-of-order pairs, letting larger values bubble toward the end.</p>
      <div class="pills">
        <span class="pill t"><b>TIME</b>O(n²)</span>
        <span class="pill s"><b>SPACE</b>O(1)</span>
      </div>
    </header>

    <div id="stage">
      <div class="wm">your-platform.com</div>
      <div id="mascot">
        <!-- original upside-down robot mascot, hanging by its feet -->
        <svg width="60" height="92" viewBox="0 0 60 92">
          <circle cx="30" cy="2" r="3" fill="#ddd"/>
          <rect x="22" y="3" width="6" height="14" rx="3" fill="#c9d3e8"/>
          <rect x="32" y="3" width="6" height="14" rx="3" fill="#c9d3e8"/>
          <path d="M6 22 L14 26 M54 22 L46 26" stroke="#ff7a45" stroke-width="6" stroke-linecap="round"/>
          <path d="M14 26 L6 42 M46 26 L54 42" stroke="#ff7a45" stroke-width="6" stroke-linecap="round"/>
          <circle cx="6" cy="44" r="4.5" fill="#ffd166"/><circle cx="54" cy="44" r="4.5" fill="#ffd166"/>
          <rect x="14" y="16" width="32" height="30" rx="10" fill="#ff7a45"/>
          <circle cx="30" cy="31" r="5.5" fill="#ffd166"/>
          <rect x="26" y="45" width="8" height="6" fill="#9aa7c4"/>
          <rect x="14" y="50" width="32" height="28" rx="13" fill="#e8eefc"/>
          <rect x="18" y="57" width="24" height="12" rx="6" fill="#10162a"/>
          <circle cx="25" cy="63" r="2.6" fill="#35d0ff"/><circle cx="35" cy="63" r="2.6" fill="#35d0ff"/>
          <line x1="30" y1="78" x2="30" y2="85" stroke="#9aa7c4" stroke-width="2"/>
          <circle cx="30" cy="87" r="3.2" fill="#ffd166"/>
        </svg>
      </div>

      <div id="persp"><div id="scene">
        <div class="box" id="platform"><i class="fr"></i><i class="tp"></i><i class="rt"></i></div>
        <div id="bars"></div>
        <div id="slots"></div>
      </div></div>
    </div>

    <div id="narr"><span class="dot"></span><span id="msg"></span></div>
    <div id="stats"><span>COMPARISONS <b id="cmp">0</b></span><span>SWAPS <b id="swp">0</b></span><span>STEP <b id="stp">0</b>/<b id="tot">0</b></span></div>
    <div id="code"></div>
  </div>
</div>

<input type="range" id="seek" min="0" value="0">
<div id="ctrl">
  <button id="reset" title="Reset">⏮</button>
  <button id="prev" title="Back (←)">◀</button>
  <button id="play" class="primary" title="Space">▶ Play</button>
  <button id="next" title="Forward (→)">▶|</button>
  <select id="speed" title="Speed">
    <option value="1.6">0.5×</option><option value="1" selected>1×</option>
    <option value="0.55">2×</option><option value="0.3">4×</option>
  </select>
</div>
<div id="ctrl2" style="margin-top:10px;display:flex;gap:8px">
  <input id="custom" value="3,2,7,8,5,4,1,6" aria-label="Array values (8 numbers, 1-8)">
  <button id="load">Load</button><button id="shuffle">Shuffle</button>
</div>
<p class="hint">Space = play/pause · ← → = step</p>

<script>
/* =========================================================
   Bubble Sort Visualizer — vanilla JS, no dependencies.
   1. buildSteps(values) turns the algorithm into a list of
      "frames" (array order, active bars, highlighted code lines,
      narration). The UI just renders frame N, so play / pause /
      step back / scrub all come for free.
   2. To add another algorithm, write another buildSteps()
      and swap the CODE array + title.
   ========================================================= */
const CODE = [
 '<span class="k">def</span> <span class="f">bubble_sort</span>(a):',
 '    n = <span class="f">len</span>(a)',
 '    <span class="k">for</span> p <span class="k">in</span> <span class="f">range</span>(n - <span class="n">1</span>):',
 '        swapped = <span class="b">False</span>',
 '        <span class="k">for</span> i <span class="k">in</span> <span class="f">range</span>(n - <span class="n">1</span> - p):',
 '            <span class="k">if</span> a[i] &gt; a[i + <span class="n">1</span>]:',
 '                a[i], a[i + <span class="n">1</span>] = a[i + <span class="n">1</span>], a[i]',
 '                swapped = <span class="b">True</span>',
 '        <span class="k">if not</span> swapped:',
 '            <span class="k">break</span>'
];

const STEP = 44, BAR_W = 34;
let vals = [3,2,7,8,5,4,1,6], steps = [], cur = 0, timer = null, scale = 1;

const $ = id => document.getElementById(id);
const barsEl = $('bars'), slotsEl = $('slots'), mascot = $('mascot'), stage = $('stage');

/* ---------- 1. algorithm -> frames ---------- */
function buildSteps(v){
  const n = v.length, order = v.map((_,i)=>i), out = [];
  let cmp = 0, swp = 0, sorted = 0;
  const push = (o) => out.push(Object.assign({order:order.slice(), active:[], sorted, lines:[], msg:'', cmp, swp, hop:null, kind:'', done:false}, o));
  push({msg:`Start with ${n} bars. Press ▶ Play and watch the largest values bubble to the right.`});
  for(let p=0; p<n-1; p++){
    push({lines:[3], msg:`Pass ${p+1}: bubble the largest unsorted value to the end.`});
    push({lines:[4], msg:'Reset swapped = False for this pass.'});
    let swapped = false;
    for(let i=0; i<n-1-p; i++){
      cmp++;
      const a = v[order[i]], b = v[order[i+1]];
      push({lines:[5,6], active:[i,i+1], kind:'cmp', msg: a>b ? `Compare ${a} and ${b}: ${a} > ${b}, so they are out of order.` : `Compare ${a} and ${b}: ${a} ≤ ${b}, already in order — no swap.`});
      if(a>b){
        const ia = order[i], ib = order[i+1];
        [order[i], order[i+1]] = [order[i+1], order[i]];
        swp++; swapped = true;
        push({lines:[7,8], active:[i,i+1], kind:'swap', hop:[ia,ib], msg:`Swap! ${a} moves right, ${b} moves left. swapped = True.`});
      }
    }
    sorted = p+1;
    if(!swapped){
      push({lines:[9], msg:'No swaps happened in this pass, so the array is already sorted.'});
      push({lines:[10], msg:'break — we can stop early.'});
      sorted = n; break;
    }
    push({lines:[9], msg:`${v[order[n-1-p]]} is now locked in its final place. Swaps happened, so go again.`});
  }
  sorted = n;
  push({done:true, msg:`Sorted in ${cmp} comparisons and ${swp} swaps. 🎉`});
  return out;
}

/* ---------- build DOM ---------- */
function buildScene(){
  barsEl.innerHTML = ''; slotsEl.innerHTML = '';
  const baseLeft = 210 - 3.5*STEP - BAR_W/2;
  vals.forEach((v,id)=>{
    const h = 22 + v*11;
    const el = document.createElement('div');
    el.className = 'box bar'; el.dataset.id = id;
    el.style.cssText = `--h:${h}px;left:${baseLeft}px;top:${-h}px`;
    el.innerHTML = `<div class="cube box" style="--w:${BAR_W}px;--h:${h}px;--d:34px;left:0;top:0">
        <i class="fr">${v}</i><i class="tp"></i><i class="rt"></i></div>`;
    barsEl.appendChild(el);
  });
  for(let i=0;i<vals.length;i++){
    const s = document.createElement('div'); s.className='slot';
    s.style.left = (210 - 3.5*STEP + i*STEP) + 'px'; slotsEl.appendChild(s);
  }
  $('code').innerHTML = CODE.map((l,i)=>`<span class="ln" data-l="${i+1}"><i>${i+1}</i>${l}</span>`).join('');
}

function init(newVals){
  stop(); vals = newVals; steps = buildSteps(vals); cur = 0;
  buildScene(); $('seek').max = steps.length-1; $('tot').textContent = steps.length-1;
  render(0, false);
}

/* ---------- 2. render one frame ---------- */
function slotRect(i){ return slotsEl.children[i].getBoundingClientRect(); }

function render(idx, animate=true){
  cur = idx; const s = steps[idx], n = vals.length;
  [...barsEl.children].forEach(el=>{
    const id = +el.dataset.id, slot = s.order.indexOf(id);
    el.style.transform = `translateX(${slot*STEP}px)`;
    el.classList.toggle('sorted', slot >= n - s.sorted);
    el.classList.toggle('active', s.kind==='cmp' && s.active.includes(slot));
    el.classList.toggle('swap',   s.kind==='swap' && s.active.includes(slot));
    el.classList.remove('hopA','hopB');
    if(animate && s.hop && s.hop.includes(id)){
      void el.offsetWidth; el.classList.add(id===s.hop[0] ? 'hopA' : 'hopB');
    }
  });
  document.querySelectorAll('.ln').forEach(l=>l.classList.toggle('hl', s.lines.includes(+l.dataset.l)));
  $('msg').textContent = s.msg; $('cmp').textContent = s.cmp; $('swp').textContent = s.swp;
  $('stp').textContent = idx; $('seek').value = idx;
  placeMascot(s);
}

function placeMascot(s){
  const sr = stage.getBoundingClientRect(), n = vals.length;
  let slotIdx = s.active.length ? (s.active[0]+s.active[1])/2 : (s.done ? (n-1)/2 : null);
  if(slotIdx === null){ slotIdx = mascot.dataset.i ? +mascot.dataset.i : (n-1)/2; }
  mascot.dataset.i = slotIdx;
  const a = slotRect(Math.floor(slotIdx)), b = slotRect(Math.ceil(slotIdx));
  const x = ((a.left+b.left)/2 - sr.left)/scale;
  // hover above the tallest active bar (bars are 22 + 11*value tall)
  const ids = s.active.length ? s.active.map(i=>s.order[i]) : s.order;
  const hMax = Math.max(...ids.map(id => 22 + vals[id]*11));
  const baseY = (a.top - sr.top)/scale;
  const hover = s.kind==='swap' ? 14 : s.kind==='cmp' ? 26 : 50;
  const y = baseY - hMax*0.8 - 92 - hover;
  mascot.style.left = x + 'px';
  mascot.style.top  = Math.max(8, y) + 'px';
  mascot.classList.toggle('dance', s.done);
}

/* ---------- playback ---------- */
const speedMs = () => 900 * parseFloat($('speed').value);
function setDur(){ document.documentElement.style.setProperty('--dur', Math.min(450, speedMs()*0.5) + 'ms'); }
function play(){
  if(cur >= steps.length-1) render(0,false);
  $('play').textContent = '⏸ Pause';
  const tick = () => {
    if(cur >= steps.length-1){ stop(); return; }
    render(cur+1); timer = setTimeout(tick, steps[cur].kind==='swap' ? speedMs()*1.15 : speedMs());
  };
  timer = setTimeout(tick, 250);
}
function stop(){ clearTimeout(timer); timer = null; $('play').textContent = '▶ Play'; }
const toggle = () => timer ? stop() : play();

$('play').onclick = toggle;
$('next').onclick = () => { stop(); if(cur<steps.length-1) render(cur+1); };
$('prev').onclick = () => { stop(); if(cur>0) render(cur-1, false); };
$('reset').onclick = () => { stop(); render(0,false); };
$('seek').oninput = e => { stop(); render(+e.target.value, false); };
$('speed').onchange = setDur;
$('shuffle').onclick = () => {
  const a=[1,2,3,4,5,6,7,8]; for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  $('custom').value = a.join(','); init(a);
};
$('load').onclick = () => {
  const a = $('custom').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>x>=1&&x<=8);
  if(a.length===8) init(a); else alert('Enter exactly 8 numbers between 1 and 8, separated by commas.');
};
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' && e.target.type!=='range') return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  if(e.code==='ArrowRight') $('next').click();
  if(e.code==='ArrowLeft') $('prev').click();
});

/* ---------- responsive scaling ---------- */
function fit(){
  const fitEl = $('fit'); scale = Math.min(1, (innerWidth-24)/420);
  fitEl.style.transform = `scale(${scale})`;
  fitEl.style.marginBottom = (-(1-scale)*fitEl.offsetHeight) + 'px';
  $('seek').style.width = $('ctrl').style.width = Math.min(420, innerWidth-24) + 'px';
  if(steps.length) placeMascot(steps[cur]);
}
addEventListener('resize', fit);

setDur(); fit(); init(vals); fit();
</script>
</body>
</html>
