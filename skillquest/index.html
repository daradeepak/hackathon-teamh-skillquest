<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3ee">
  <meta name="description" content="XPedition helps you build soft skills and technical skills through short, playable challenges.">
  <title>XPedition — grow through play</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23705ce8'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='800' font-size='26' text-anchor='middle' fill='white'%3EXP%2B%3C/text%3E%3C/svg%3E">
  <script src="theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bubble-sort.css">
  <link rel="stylesheet" href="skills.css">
  <link rel="stylesheet" href="binary-search.css">
  <link rel="stylesheet" href="aicheck.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="polish.css">
  <link rel="stylesheet" href="minigames.css">
  <script src="developer-games.js" defer></script>
  <script src="aicheck-games.js" defer></script>
  <script src="developer-visuals.js" defer></script>
  <script src="developer-js-lessons.js" defer></script>
  <script src="bubble-sort.js" defer></script>
  <script src="binary-search.js" defer></script>
  <script src="minigames.js" defer></script>
  <script src="aicheck-app.js" defer></script>
  <script src="developer-app.js" defer></script>
</head>
<body class="auth-locked">
  <div id="auth-root" class="auth-root"><p class="auth-loading" role="status">Loading XPedition…</p></div>
  <div class="app-shell" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#" data-nav="home" aria-label="XPedition home">
        <span class="brand-mark xp-logo" aria-hidden="true"><span class="xp-logo-text">XP</span><span class="xp-logo-plus">+</span></span>
        <span class="brand-name">XPedition<span class="brand-dot">.</span></span>
      </a>
      <div class="sidebar-label">LET’S PLAY</div>
      <nav class="main-nav">
        <button class="nav-item is-active" data-nav="home"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-item" data-nav="map"><span class="nav-icon">◎</span>Game Map</button>
        <button class="nav-item" data-nav="minigames"><span class="nav-icon">🕹️</span>Mini games</button>
        <button class="nav-item" data-nav="anim"><span class="nav-icon">▶</span>Play Lab</button>
        <button class="nav-item" data-nav="leaderboard"><span class="nav-icon">♛</span>Leaderboard</button>
        <button class="nav-item" data-nav="achievements"><span class="nav-icon">🏅</span>Achievements</button>
        <button class="nav-item" data-nav="stats"><span class="nav-icon">▤</span>Progress</button>
      </nav>
      <div class="sidebar-card">
        <div class="sidebar-card-spark">✦</div>
        <strong>Ready for a mini-mission?</strong>
        <p>No pressure. Just a little practice and a tiny win.</p>
        <button class="text-button" data-action="continue">Let’s play <span>→</span></button>
      </div>
      <button class="sidebar-bottom settings-entry" id="settings-entry" type="button" data-action="settings" aria-label="Open settings">
        <span class="avatar avatar-default" id="profile-avatar" aria-hidden="true"></span>
        <span class="profile-mini"><strong id="profile-name">Player</strong><span id="profile-subtitle">Level 1</span></span>
        <span class="settings-gear" aria-hidden="true">⚙</span>
      </button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Your game corner</span><span class="breadcrumb-slash">/</span><strong id="page-label">Home</strong></div>
        <div class="topbar-right">
          <span class="topbar-caption">Tiny missions, real-life skills</span>
          <button class="theme-toggle" id="theme-toggle" data-action="theme" aria-pressed="false" aria-label="Switch to dark mode" title="Switch theme">🌙</button>
          <button class="top-avatar avatar-default" id="top-avatar" data-action="settings" aria-label="Open settings"></button>
        </div>
      </header>
      <div id="daily-taskbar" class="daily-taskbar" hidden aria-label="Daily goals"></div>
      <div id="app-main" class="page-content" tabindex="-1"></div>
      <footer class="page-footer">All scenarios are fictional, and there are no wrong answers.</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="account-modal-root"></div>
</body>
</html>
