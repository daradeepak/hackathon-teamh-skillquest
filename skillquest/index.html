<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3ee">
  <meta name="description" content="XPaddition helps you build soft skills and technical skills through short, playable challenges.">
  <title>XPaddition — grow through play</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23705ce8'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='800' font-size='26' text-anchor='middle' fill='white'%3EXP%2B%3C/text%3E%3C/svg%3E">
  <script>
    /* Apply the saved theme before the page paints so there is no flash of the wrong theme. */
    (function() {
      var theme = null;
      try { theme = localStorage.getItem("xpaddition-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bubble-sort.css">
  <link rel="stylesheet" href="skills.css">
  <link rel="stylesheet" href="theme.css">
  <script src="developer-games.js" defer></script>
  <script src="bubble-sort.js" defer></script>
  <script src="developer-app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#" data-nav="home" aria-label="XPaddition home">
        <span class="brand-mark xp-logo" aria-hidden="true"><span class="xp-logo-text">XP</span><span class="xp-logo-plus">+</span></span>
        <span class="brand-name">xpaddition<span class="brand-dot">.</span></span>
      </a>
      <div class="sidebar-label">LET’S PLAY</div>
      <nav class="main-nav">
        <button class="nav-item is-active" data-nav="home"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-item" data-nav="map"><span class="nav-icon">◎</span>Game Map</button>
        <button class="nav-item" data-nav="leaderboard"><span class="nav-icon">♛</span>Leaderboard</button>
        <button class="nav-item" data-nav="stats"><span class="nav-icon">▤</span>Scoreboard</button>
      </nav>
      <div class="sidebar-card">
        <div class="sidebar-card-spark">✦</div>
        <strong>Ready for a mini-mission?</strong>
        <p>No pressure. Just a little practice and a tiny win.</p>
        <button class="text-button" data-action="continue">Let’s play <span>→</span></button>
      </div>
      <div class="sidebar-bottom">
        <button class="avatar" id="profile-avatar" data-action="profile" aria-label="Open your profile">AM</button>
        <div class="profile-mini"><strong id="profile-name">Arjun</strong><span id="profile-subtitle">Junior dev · Level 2</span></div>
        <button class="icon-button reset-button" data-action="reset" aria-label="Reset progress" title="Reset progress">↻</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Your game corner</span><span class="breadcrumb-slash">/</span><strong id="page-label">Home</strong></div>
        <div class="topbar-right">
          <span class="topbar-caption">Tiny missions, real-life skills</span>
          <button class="account-toggle" id="account-toggle" data-action="account">Sign in / create account</button>
          <button class="theme-toggle" id="theme-toggle" data-action="theme" aria-pressed="false" aria-label="Switch to dark mode" title="Switch theme">🌙</button>
          <button class="sound-toggle" data-action="sound" aria-pressed="false">🔈 Sound off</button>
          <button class="top-avatar" id="top-avatar" data-action="profile" aria-label="Open your profile">AM</button>
        </div>
      </header>
      <div id="app-main" class="page-content" tabindex="-1"></div>
      <footer class="page-footer">All scenarios are fictional, and there are no wrong answers. Demo accounts and progress stay on this computer.</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="account-modal-root"></div>
</body>
</html>
