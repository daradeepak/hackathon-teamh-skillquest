name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xpedition
          POSTGRES_PASSWORD: xpedition_ci
          POSTGRES_DB: xpedition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xpedition"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://xpedition:xpedition_ci@localhost:5432/xpedition_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skillquest/package-lock.json
      - name: Install
        working-directory: skillquest
        run: npm ci
      - name: Syntax check
        working-directory: skillquest
        run: for f in *.js lib/*.js scripts/*.js; do node --check "$f"; done
      - name: Tests
        working-directory: skillquest
        run: npm test
